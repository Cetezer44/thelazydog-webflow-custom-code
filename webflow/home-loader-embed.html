<style>
/* Loader page d'accueil — affiché seulement quand le script l'active (invisible dans le Designer) */
.tld-loader{display:none}
html.tld-loading,html.tld-loading body{overflow:hidden}
html.tld-loading .tld-loader{display:block}
html.tld-loading .tld-eye{visibility:hidden}
html.tld-loading .tld-hero__title,html.tld-loading .tld-reel,html.tld-loading .tld-nav__link{opacity:0}
.tld-line{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.tld-line__in{display:block}
.tld-loader{position:fixed;top:0;right:0;bottom:0;left:0;z-index:9000}
.tld-loader__bg{position:absolute;top:0;right:0;bottom:0;left:0;background-color:#f3efe9}
.tld-loader__stage{position:absolute;left:50%;top:50%;width:0;height:0}
.tld-loader__l{position:absolute;left:0;top:0;display:block;opacity:0;will-change:transform,opacity}
.tld-loader__l svg{display:block;width:100%;height:100%;overflow:visible}
</style>
<script>(function(d){d.documentElement.classList.add('tld-loading');setTimeout(function(){d.documentElement.classList.remove('tld-loading');},8000);})(document);</script>
